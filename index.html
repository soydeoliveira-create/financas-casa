<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Finanças da casa</title>
<style>
:root{
  color-scheme:light;
  --fundo:#f4f3ee; --superficie:#fcfcfb; --tinta:#1a2226; --tinta2:#52514e; --tinta3:#7b7a74;
  --linha:#e4e2da; --linha2:#efede6; --marca:#14504f; --marca2:#e3efec;
  --serie1:#2a78d6; --serie2:#eb6834; --bom:#14713f; --ruim:#b3261e; --aviso-bg:#fdf3df; --aviso-linha:#eed9a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:15px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
header{background:var(--marca);color:#fff}
.topo{max-width:1240px;margin:0 auto;padding:18px 24px 0;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0 0 12px;font-size:20px;font-weight:650;letter-spacing:-.01em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:#d5e6e2;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:550}
nav button:hover{color:#fff}
nav button[aria-selected=true]{background:var(--fundo);color:var(--marca)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 40px}
h2{font-size:17px;margin:0;font-weight:650}
h3{font-size:14px;margin:0 0 2px;font-weight:650}
.sub{color:var(--tinta2);font-size:13.5px;margin:2px 0 0}
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:16px 18px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.mesnav{display:flex;align-items:center;gap:6px}
.mesnav strong{min-width:150px;text-align:center;font-size:16px}
.btn{background:var(--superficie);border:1px solid #cfccc1;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:550;font-size:14px}
.btn:hover{background:#f2f0e9}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}
.btn.pri:hover{background:#0f4140}
.btn.peq{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--serie1);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi .rot{color:var(--tinta2);font-size:13.5px}
.kpi .val{font-size:25px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
.kpi .nota{font-size:13px;color:var(--tinta2);margin-top:2px}
.neg{color:var(--ruim)} .pos{color:var(--bom)}
.colunas{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.pilha{display:grid;gap:14px}
@media(max-width:900px){.colunas{grid-template-columns:minmax(0,1fr)}}
.aviso{background:var(--aviso-bg);border:1px solid var(--aviso-linha);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.aviso ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.aviso li{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:14px}
.grupo{display:flex;justify-content:space-between;font-weight:650;font-size:13.5px;color:var(--tinta2);padding:12px 0 4px;border-bottom:1px solid var(--linha)}
.grupo:first-of-type{padding-top:6px}
.conta{border-bottom:1px solid var(--linha2);padding:3px 0}
.conta .linha{display:flex;align-items:center;gap:8px}
.item{display:flex;align-items:center;gap:9px;padding:3px 0;cursor:pointer;flex:1;min-width:0}
.parcial{font-size:13px;color:var(--tinta2);padding:1px 0 3px 26px}
.parcial .hist{display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:1px}
.parcial .hist .x{font-size:13px;padding:0 4px}
.parteform{display:flex;gap:6px;align-items:center;padding:3px 0 6px 26px;flex-wrap:wrap}
.dividas{display:grid;gap:12px}
.divida .topo2{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.divida .falta{font-size:20px;font-weight:650}
.divida .abate{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.divida input{width:130px;border:1px solid #cfccc1;border-radius:8px;padding:5px 9px;background:#fff}
.divida .hist{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13px;color:var(--tinta2);margin-top:6px}
.divida .hist .x{font-size:13px;padding:0 4px}
.parteform input{width:120px;border:1px solid #cfccc1;border-radius:8px;padding:4px 8px;background:#fff}
.item span:first-of-type{flex:1;min-width:0}
.item.pago span{color:var(--tinta3);text-decoration:line-through}
.item input{width:17px;height:17px;accent-color:var(--marca);margin:0}
.progresso{height:7px;border-radius:4px;background:var(--linha2);overflow:hidden;margin:10px 0 4px}
.progresso i{display:block;height:100%;background:var(--marca)}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--tinta2);margin:6px 0 2px}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.grafico svg{display:block;width:100%;height:auto}
.dica{position:fixed;z-index:20;background:#fff;border:1px solid var(--linha);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:7px 11px;font-size:13px;pointer-events:none;display:none;max-width:240px}
.dica b{display:block;font-size:14px}
.dica div{display:flex;gap:7px;align-items:center}
.dica i{width:12px;height:2px;display:inline-block}
.rola{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--linha);border-radius:12px;background:var(--superficie)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:0;border-bottom:1px solid var(--linha2);text-align:right;white-space:nowrap;font-size:14px}
thead th{position:sticky;top:0;background:#f0eee7;z-index:2;padding:8px 8px;font-size:13px;font-weight:650;color:var(--tinta2);border-bottom:1px solid var(--linha)}
th.nome,td.nome{position:sticky;left:0;background:var(--superficie);text-align:left;z-index:1;border-right:1px solid var(--linha);min-width:210px;max-width:290px}
thead th.nome{background:#f0eee7;z-index:3}
td.nome .wrap{display:flex;align-items:center;gap:4px;padding-right:4px}
td.txt{padding:5px 8px;text-align:left;color:var(--tinta2);font-size:13px}
td.num{padding:6px 8px}
tfoot td{position:sticky;bottom:0;background:#f0eee7;font-weight:650;padding:8px;border-bottom:0;border-top:1px solid var(--linha)}
tfoot td.nome{background:#f0eee7;z-index:3}
tr.sec td{background:#f7f6f1;font-size:12.5px;font-weight:650;color:var(--tinta2);padding:6px 8px;text-align:left}
tr.sec td.nome{background:#f7f6f1}
.atual{background:var(--marca2)!important}
thead th.atual{color:var(--marca)}
input.cel{width:92px;border:0;background:transparent;text-align:right;padding:6px 8px;border-radius:4px}
input.cel:hover{background:#f0eee7}
input.cel:focus{background:#fff;outline:2px solid var(--serie1)}
input.cel::placeholder{color:var(--tinta3);font-style:italic;opacity:1}
input.nomecel{flex:1;min-width:0;border:0;background:transparent;padding:6px 8px;font-weight:550;text-overflow:ellipsis}
input.nomecel:focus{background:#fff;outline:2px solid var(--serie1);border-radius:4px}
select.grp{border:0;background:transparent;font-size:12.5px;color:var(--tinta2);padding:4px;max-width:150px}
.x{border:0;background:none;color:var(--tinta3);cursor:pointer;font-size:15px;line-height:1;padding:3px 6px;border-radius:4px}
.x:hover{background:#f7dfdc;color:var(--ruim)}
.confere{color:#8a5a00;font-size:12.5px;display:block;line-height:1.1}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.form label{display:grid;gap:3px;font-size:13px;color:var(--tinta2)}
.form input,.form select{border:1px solid #cfccc1;border-radius:8px;padding:6px 9px;background:#fff;font-size:14px;color:var(--tinta)}
.form input.largo{width:250px}.form input.curto{width:110px}
details{margin-top:14px;font-size:14px;color:var(--tinta2)}
details summary{cursor:pointer;font-weight:550}
details ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
footer{max-width:1240px;margin:0 auto;padding:0 24px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--tinta2);font-size:13.5px}
footer div{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--marca)}
body.fora nav,body.fora footer{display:none}
.estado{max-width:1240px;margin:0 auto;padding:6px 24px 0;font-size:13px;color:var(--tinta2);text-align:right;min-height:25px}
.estado.erro{color:#fff;background:var(--ruim);font-weight:600;font-size:15px;text-align:center;padding:10px 24px;max-width:none}
.entrada{max-width:380px;margin:50px auto;display:grid;gap:12px}
.entrada label{display:grid;gap:4px;font-size:13.5px;color:var(--tinta2)}
.entrada input{border:1px solid #cfccc1;border-radius:8px;padding:9px 11px;background:#fff;font-size:15px;color:var(--tinta)}
.entrada .btn{padding:9px 12px}
.link{background:none;border:0;color:var(--marca);cursor:pointer;text-decoration:underline;font-size:14px;padding:0}
.erro-txt{color:var(--ruim);font-size:14px;margin:0}
</style>
</head>
<body>
<header><div class="topo">
  <h1>Finanças da casa</h1>
  <nav role="tablist" id="abas"></nav>
</div></header>
<div class="estado" id="estado" role="status"></div>
<main id="tela"></main>
<footer id="rodape">
  <span id="quem"></span>
  <div>
    <button class="btn peq" id="baixar">Baixar cópia</button>
    <button class="btn peq" id="abrir">Abrir cópia</button>
    <button class="btn peq" id="sair">Sair</button>
    <input type="file" id="arquivo" accept=".json,application/json" hidden>
  </div>
</footer>
<div class="dica" id="dica"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
'use strict';
const SB_URL='https://ihvbbsgdkmdxfpouvqmd.supabase.co';
const SB_KEY='sb_publishable_ZmwamZS66VJ6aBj8tYES-g_3BIswXip';
const sb=supabase.createClient(SB_URL,SB_KEY);
const GRUPOS=['Cartões e crediário','Casa','Carro','Educação','Saúde','Dízimo e oferta','Outros'];
const NOMES_MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CURTO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let S=null;
let usuario=null,versao=0,temLinha=false;
let timer=null,gravando=false,pendente=false,travado=false,ultimoErro='';
let parteAberta='';
let aba='resumo';
let mes=null;
let soFalta=true;

function valido(o){return o&&Array.isArray(o.despesas)&&Array.isArray(o.receitas)&&o.cartao&&Array.isArray(o.cartao.linhas)&&typeof o.pagos==='object'}
function aviso(txt,erro){const e=document.getElementById('estado');e.textContent=txt;e.classList.toggle('erro',!!erro)}
function salvar(){
  if(travado)return;
  pendente=true;aviso('Salvando…');
  clearTimeout(timer);timer=setTimeout(gravar,500);
}
async function gravar(){
  if(gravando||!pendente||travado)return;
  gravando=true;pendente=false;clearTimeout(timer);timer=null;
  const dados=JSON.parse(JSON.stringify(S));
  try{
    let r;
    if(temLinha)r=await sb.from('financas').update({dados,versao:versao+1,atualizado_em:new Date().toISOString()}).eq('dono',usuario.id).eq('versao',versao).select('versao');
    else r=await sb.from('financas').insert({dono:usuario.id,dados,versao:1}).select('versao');
    if(r.error)throw r.error;
    if(!r.data||!r.data.length){
      travado=true;pendente=false;
      aviso('Os dados foram alterados em outro aparelho. Recarregue a página antes de continuar.',true);
      if(confirm('Os dados foram alterados em outro aparelho. Recarregar agora? O que você digitou por último aqui não será salvo.'))location.reload();
      return;
    }
    versao=r.data[0].versao;temLinha=true;
    if(!pendente)aviso('Tudo salvo');
  }catch(e){
    pendente=true;ultimoErro=(e&&(e.message||e.code))||'sem conexão';
    aviso('ATENÇÃO: seus dados NÃO foram salvos. Motivo: '+((e&&e.message)||'sem conexão')+'. Tentando de novo…',true);
    clearTimeout(timer);timer=setTimeout(gravar,5000);
  }finally{
    gravando=false;
    if(pendente&&!travado&&!timer)timer=setTimeout(gravar,500);
  }
}
addEventListener('beforeunload',e=>{if(pendente||gravando){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&pendente)gravar()});

/* ---------- utilidades ---------- */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=n=>(n<0?'− ':'')+'R$ '+fmt(Math.abs(n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lerNumero(s){
  s=String(s).replace(/[R$\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  const n=Number(s);return Number.isFinite(n)?r2(n):NaN;
}
const ymNum=ym=>{const[a,m]=ym.split('-').map(Number);return a*12+m-1};
const numYm=n=>Math.floor(n/12)+'-'+String(n%12+1).padStart(2,'0');
const somaMes=(ym,k)=>numYm(ymNum(ym)+k);
const nomeMes=ym=>{const[a,m]=ym.split('-').map(Number);return NOMES_MES[m-1]+' de '+a};
const curtoMes=ym=>{const[a,m]=ym.split('-').map(Number);return CURTO[m-1]+'/'+String(a).slice(2)};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const novoId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- contas ---------- */
function parcelaDe(l,ym){
  const a=l.parcelas[ym]||0;
  return S.cartao.incluirConferir?a+((l.aConferir||{})[ym]||0):a;
}
function totalCartao(ym){return r2(S.cartao.linhas.reduce((t,l)=>t+parcelaDe(l,ym),0))}
function valorConta(d,ym){
  const v=d.valores[ym];
  if(typeof v==='number')return v;
  return d.cartao?totalCartao(ym):0;
}
function parciais(d,ym){return (S.parciais||{})[ym+'|'+d.id]||[]}
function somaParcial(d,ym){return r2(parciais(d,ym).reduce((t,p)=>t+p.v,0))}
function quitada(d,ym){const v=valorConta(d,ym);return !!S.pagos[ym+'|'+d.id]||(v>0&&somaParcial(d,ym)>=v)}
function pagoDe(d,ym){const v=valorConta(d,ym);return quitada(d,ym)?v:Math.min(v,somaParcial(d,ym))}
function totalDespesas(ym){return r2(S.despesas.reduce((t,d)=>t+valorConta(d,ym),0))}
function totalReceitas(ym){return r2(S.receitas.reduce((t,r)=>t+(r.valores[ym]||0),0))}
function temContas(ym){return S.despesas.some(d=>!d.cartao&&typeof d.valores[ym]==='number')}
function temReceita(ym){return S.receitas.some(r=>typeof r.valores[ym]==='number')}
function fechado(ym){return temContas(ym)&&temReceita(ym)}
function todosMeses(){
  const ks=new Set();
  S.despesas.forEach(d=>Object.keys(d.valores).forEach(k=>ks.add(k)));
  S.receitas.forEach(r=>Object.keys(r.valores).forEach(k=>ks.add(k)));
  S.cartao.linhas.forEach(l=>{Object.keys(l.parcelas).forEach(k=>ks.add(k));if(S.cartao.incluirConferir)Object.keys(l.aConferir||{}).forEach(k=>ks.add(k))});
  if(!ks.size)return[hoje()];
  const n=[...ks].map(ymNum),a=Math.min(...n),b=Math.max(...n),o=[];
  for(let i=a;i<=b;i++)o.push(numYm(i));
  return o;
}
function mesesDe(ini){return todosMeses().filter(m=>m>=ini)}
function primeiroMesContas(){
  const ks=[];S.despesas.forEach(d=>ks.push(...Object.keys(d.valores)));S.receitas.forEach(r=>ks.push(...Object.keys(r.valores)));
  return ks.sort()[0]||hoje();
}
function acumulado(ate){
  let t=0;for(const m of todosMeses()){if(m>ate)break;if(fechado(m))t+=totalReceitas(m)-totalDespesas(m)}
  return r2(t);
}
function aConferirTotal(){
  let t=0;S.cartao.linhas.forEach(l=>Object.values(l.aConferir||{}).forEach(v=>t+=v));return r2(t);
}

/* ---------- abas ---------- */
const nomeCartao=()=>'Cartão '+S.cartao.nome;
const abasLista=()=>[['resumo','Resumo'],['despesas','Despesas'],['cartao',nomeCartao()],['receitas','Receitas'],['dividas','Abater cartões']];
function desenhar(){
  document.getElementById('abas').innerHTML=abasLista().map(([k,n])=>`<button role="tab" aria-selected="${k===aba}" data-aba="${k}">${n}</button>`).join('');
  ({resumo:telaResumo,despesas:telaDespesas,cartao:telaCartao,receitas:telaReceitas,dividas:telaDividas})[aba]();
}
document.getElementById('abas').addEventListener('click',e=>{const k=e.target.dataset.aba;if(k){aba=k;desenhar()}});

/* ---------- resumo ---------- */
function telaResumo(){
  const lista=todosMeses();
  if(!mes){const h=hoje();mes=lista.includes(h)?h:primeiroMesContas()}
  if(!lista.includes(mes))mes=lista[0];
  const rec=totalReceitas(mes),des=totalDespesas(mes),completo=temContas(mes),comRec=temReceita(mes);
  const i=lista.indexOf(mes),anterior=lista[i-1];
  const podeCopiar=!completo&&anterior&&temContas(anterior);
  const saldo=r2(rec-des);
  let kSaldo;
  if(fechado(mes))kSaldo=`<div class="val ${saldo<0?'neg':'pos'}">${brl(saldo)}</div><div class="nota">receitas menos despesas do mês</div>`;
  else kSaldo=`<div class="val">—</div><div class="nota">${!completo?'faltam as contas deste mês':'falta a receita deste mês'}</div>`;
  const pagos=S.despesas.filter(d=>valorConta(d,mes)>0);
  const pagoT=r2(pagos.reduce((t,d)=>t+pagoDe(d,mes),0));
  const pct=des?Math.round(pagoT/des*100):0;
  const blocos=GRUPOS.map(g=>{
    const it=pagos.filter(d=>d.grupo===g);if(!it.length)return'';
    const tot=it.reduce((t,d)=>t+valorConta(d,mes),0);
    return `<div class="grupo"><span>${esc(g)}</span><span>${fmt(tot)}</span></div>`+it.map(d=>{
      const p=quitada(d,mes),v=valorConta(d,mes),ps=parciais(d,mes),sp=somaParcial(d,mes),aberta=parteAberta===mes+'|'+d.id;
      const hist=ps.length?`<div class="parcial">${p?'Pago em partes':`Pago ${fmt(sp)} · falta <b>${fmt(r2(v-sp))}</b>`}<div class="hist">${ps.map((x,i)=>`<span>${x.d.split('-').reverse().slice(0,2).join('/')}: ${fmt(x.v)}<button class="x" data-tira-parte="${i}" data-conta="${esc(d.id)}" aria-label="Apagar pagamento de ${fmt(x.v)}">×</button></span>`).join('')}</div></div>`:'';
      const form=aberta&&!p?`<form class="parteform" id="parte" data-conta="${esc(d.id)}"><input name="valor" inputmode="decimal" placeholder="Valor pago" aria-label="Valor pago de ${esc(d.nome)}" required><button class="btn peq pri">Lançar</button><button type="button" class="btn peq" data-parte="${esc(d.id)}">Cancelar</button></form>`:'';
      return `<div class="conta"><div class="linha"><label class="item ${p?'pago':''}"><input type="checkbox" data-pago="${esc(d.id)}" ${p?'checked':''}><span>${esc(d.nome)}</span><span>${fmt(v)}</span></label>${p||aberta?'':`<button class="btn peq" data-parte="${esc(d.id)}">Pagar parte</button>`}</div>${hist}${form}</div>`;
    }).join('');
  }).join('');
  const avisos=listaAvisos();
  document.getElementById('tela').innerHTML=`
  <div class="barra">
    <div class="mesnav">

function listaAvisos(){
  const o=[];
  const c=S.despesas.find(d=>d.cartao);
  if(c)Object.keys(c.valores).sort().forEach(m=>{
    const a=c.valores[m],b=totalCartao(m),d=r2(a-b);
    if(Math.abs(d)>=.01&&(S.cartao.mantidos||{})[m]!==a)o.push(`<li><span>${curtoMes(m)}: você lançou <b>${brl(a)}</b> e as parcelas do cartão somam <b>${brl(b)}</b>.</span><span style="display:flex;gap:6px"><button class="btn peq" data-manter="${m}">Manter o meu</button><button class="btn peq" data-usar="${m}">Usar a soma do cartão</button></span></li>`);
  });
  const t=aConferirTotal();
  if(t>0&&!S.cartao.incluirConferir)o.push(`<li><span>Há <b>${brl(t)}</b> em parcelas do cartão que ficaram fora da soma original.</span><button class="btn peq" data-incluir="1">Incluir na conta</button></li>`);
  return o;
}
document.getElementById('tela').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='trocaModo'){modoCriar=!modoCriar;erroLogin='';telaLogin();return}
  if(b.id==='importar'){document.getElementById('arquivo').click();return}
  if(b.dataset.mes){const l=todosMeses();mes=l[l.indexOf(mes)+Number(b.dataset.mes)];desenhar()}
  else if(b.id==='copiar'){
    const l=todosMeses(),ant=l[l.indexOf(mes)-1];
    if(!confirm(`Trazer as contas de ${nomeMes(ant)} para ${nomeMes(mes)}? Os valores entram iguais e você ajusta o que mudou na aba Despesas.`))return;
    S.despesas.forEach(d=>{if(!d.cartao&&typeof d.valores[ant]==='number'&&typeof d.valores[mes]!=='number')d.valores[mes]=d.valores[ant]});
    salvar();desenhar();
  }
  else if(b.dataset.usar){const c=S.despesas.find(d=>d.cartao);delete c.valores[b.dataset.usar];salvar();desenhar()}
  else if(b.dataset.parte){
    const k=mes+'|'+b.dataset.parte;parteAberta=parteAberta===k?'':k;desenhar();
    const i=document.querySelector('#parte input');if(i)i.focus();
  }
  else if(b.dataset.tiraParte){
    const k=mes+'|'+b.dataset.conta,l=S.parciais[k];
    if(!confirm('Apagar este pagamento?'))return;
    l.splice(Number(b.dataset.tiraParte),1);if(!l.length)delete S.parciais[k];
    salvar();desenhar();
  }
  else if(b.id==='cadTodos'){
    S.dividas=S.dividas||[];
    document.querySelectorAll('form[data-cad-cartao]').forEach(f=>{
      const c=S.despesas.find(x=>x.id===f.dataset.cadCartao),total=lerNumero(f.total.value);
      if(total>0)S.dividas.push({id:novoId('d'),conta:c.id,nome:c.nome,total,abatimentos:[]});
    });
    salvar();desenhar();
  }
  else if(b.dataset.apagaDivida){
    const c=S.dividas.find(x=>x.id===b.dataset.apagaDivida);
    if(confirm('Apagar a dívida "'+c.nome+'" e todos os abatimentos dela?')){S.dividas=S.dividas.filter(x=>x!==c);salvar();desenhar()}
  }
  else if(b.dataset.tiraAbate){
    const c=S.dividas.find(x=>x.id===b.dataset.divida);
    if(confirm('Apagar este abatimento?')){c.abatimentos.splice(Number(b.dataset.tiraAbate),1);salvar();desenhar()}
  }
  else if(b.dataset.manter){
    const c=S.despesas.find(d=>d.cartao),m=S.cartao.mantidos=S.cartao.mantidos||{};
    (b.dataset.manter==='todos'?Object.keys(c.valores):[b.dataset.manter]).forEach(k=>{m[k]=c.valores[k]});
    salvar();desenhar();
  }
  else if(b.dataset.incluir){S.cartao.incluirConferir=true;salvar();desenhar()}
  else if(b.dataset.apagaConta){
    const d=S.despesas.find(x=>x.id===b.dataset.apagaConta);
    if(confirm(`Apagar a conta "${d.nome}" de todos os meses?`)){S.despesas=S.despesas.filter(x=>x!==d);salvar();desenhar()}
  }
  else if(b.dataset.apagaReceita){
    const d=S.receitas.find(x=>x.id===b.dataset.apagaReceita);
    if(confirm(`Apagar a receita "${d.nome}" de todos os meses?`)){S.receitas=S.receitas.filter(x=>x!==d);salvar();desenhar()}
  }
  else if(b.dataset.apagaLinha){
    const d=S.cartao.linhas.find(x=>x.id===b.dataset.apagaLinha);
    if(confirm(`Apagar "${d.desc}" e todas as parcelas dela?`)){S.cartao.linhas=S.cartao.linhas.filter(x=>x!==d);salvar();desenhar()}
  }
});
document.getElementById('tela').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pago){
    const k=mes+'|'+t.dataset.pago,tem=(S.parciais||{})[k];
    if(t.checked)S.pagos[k]=true;
    else{
      if(tem&&tem.length){
        if(!confirm('Desmarcar apaga os pagamentos em partes desta conta neste mês. Continuar?')){t.checked=true;return}
        delete S.parciais[k];
      }
      delete S.pagos[k];
    }
    salvar();desenhar();return;
  }
  if(t.dataset.dividaTotal){
    const c=S.dividas.find(x=>x.id===t.dataset.dividaTotal),n=lerNumero(t.value);
    if(!n||n<=0){t.value=fmt(c.total);return}
    c.total=n;salvar();desenhar();return;
  }
  if(t.id==='soFalta'){soFalta=t.checked;desenhar();return}
  if(t.id==='incluirConferir'){S.cartao.incluirConferir=t.checked;salvar();desenhar();return}
  if(t.dataset.grupo){S.despesas.find(d=>d.id===t.dataset.grupo).grupo=t.value;salvar();return}
  if(t.dataset.nomeConta){const v=t.value.trim();const d=S.despesas.find(x=>x.id===t.dataset.nomeConta);if(v)d.nome=v;else t.value=d.nome;salvar();return}
  if(t.dataset.nomeReceita){const v=t.value.trim();const d=S.receitas.find(x=>x.id===t.dataset.nomeReceita);if(v)d.nome=v;else t.value=d.nome;salvar();return}
  if(t.classList.contains('cel')){
    const n=lerNumero(t.value),{tipo,id,ym}=t.dataset;
    const alvo=tipo==='conta'?S.despesas.find(d=>d.id===id).valores:tipo==='receita'?S.receitas.find(d=>d.id===id).valores:S.cartao.linhas.find(d=>d.id===id).parcelas;
    if(Number.isNaN(n)){t.value=typeof alvo[ym]==='number'?fmt(alvo[ym]):'';t.focus();return}
    if(n===null)delete alvo[ym];else alvo[ym]=n;
    t.value=n===null?'':fmt(n);
    salvar();atualizarRodape();
  }
});
document.getElementById('tela').addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,d=new FormData(f);
  if(f.id==='login'){entrar(d.get('email').trim(),d.get('senha'));return}
  if(f.id==='parte'){
    const c=S.despesas.find(x=>x.id===f.dataset.conta),n=lerNumero(d.get('valor')),falta=r2(valorConta(c,mes)-pagoDe(c,mes));
    if(!n||n<=0){alert('Digite o valor pago.');return}
    if(n>falta){alert('Esse valor passa do que falta nesta conta, que é '+brl(falta)+'.');return}
    const h=new Date(),k=mes+'|'+c.id;
    S.parciais=S.parciais||{};(S.parciais[k]=S.parciais[k]||[]).push({v:n,d:h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0')});
    parteAberta='';salvar();desenhar();return;
  }
  if(f.dataset.cadCartao){
    const c=S.despesas.find(x=>x.id===f.dataset.cadCartao),total=lerNumero(d.get('total'));
    if(!total||total<=0){alert('Digite o total da dívida.');return}
    (S.dividas=S.dividas||[]).push({id:novoId('d'),conta:c.id,nome:c.nome,total,abatimentos:[]});salvar();desenhar();return;
  }
  if(f.id==='novaDivida'){
    const nome=d.get('nome').trim(),total=lerNumero(d.get('total'));
    if(!nome||!total||total<=0){alert('Preencha o nome e o total da dívida.');return}
    (S.dividas=S.dividas||[]).push({id:novoId('d'),nome,total,abatimentos:[]});salvar();desenhar();return;
  }
  if(f.dataset.abater){
    const c=S.dividas.find(x=>x.id===f.dataset.abater),n=lerNumero(d.get('valor')),falta=faltaDivida(c);
    if(!n||n<=0){alert('Digite o valor pago.');return}
    if(n>falta){alert('Esse valor passa do que falta nesta dívida, que é '+brl(falta)+'.');return}
    const h=new Date();
    c.abatimentos.push({v:n,d:h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0')});
    salvar();desenhar();return;
  }
  if(f.id==='novaConta'){
    const nome=d.get('nome').trim();if(!nome)return;
    S.despesas.push({id:novoId('c'),nome,grupo:d.get('grupo'),valores:{}});salvar();desenhar();
  }else if(f.id==='novaReceita'){
    const nome=d.get('nome').trim();if(!nome)return;
    S.receitas.push({id:novoId('r'),nome,valores:{}});salvar();desenhar();
  }else if(f.id==='novaCompra'){
    const desc=d.get('desc').trim(),v=lerNumero(d.get('valor')),n=Math.floor(Number(d.get('n'))),ini=d.get('ini');
    if(!desc||!v||v<=0||!(n>=1)||!/^\d{4}-\d{2}$/.test(ini)){alert('Preencha a descrição, o valor da parcela, o número de parcelas e o primeiro mês.');return}
    const parcelas={};for(let i=0;i<n;i++)parcelas[somaMes(ini,i)]=v;
    S.cartao.linhas.push({id:novoId('n'),desc,tipo:'manual',parcelas,aConferir:{}});salvar();desenhar();
  }
});
function atualizarRodape(){
  document.querySelectorAll('[data-total]').forEach(c=>{
    const[k,ym]=c.dataset.total.split('|');
    const v=k==='desp'?totalDespesas(ym):k==='rec'?totalReceitas(ym):k==='cartao'?totalCartao(ym):null;
    if(k==='saldo'){
      if(fechado(ym)){const s=r2(totalReceitas(ym)-totalDespesas(ym));c.textContent=fmt(s);c.className=s<0?'neg':'pos'}else{c.textContent='—';c.className=''}
    }else c.textContent=fmt(v);
  });
}

/* ---------- cartão ---------- */
function telaCartao(){

  const h=hoje(),t=aConferirTotal();

    return `<td class="${m===h?'atual':''}"><input class="cel" inputmode="decimal" data-tipo="linha" data-id="${esc(l.id)}" data-ym="${m}" value="${typeof v==='number'?fmt(v):''}" placeholder="${c&&S.cartao.incluirConferir?fmt(c):''}" aria-label="${esc(l.desc)} ${curtoMes(m)}">${c&&!S.cartao.incluirConferir?`<span class="confere" title="Parcela que a planilha não somou">+${fmt(c)}?</span>`:''}</td>`;

  const sec=(n,ls)=>ls.length?`<tr class="sec"><td class="nome">${n}</td><td colspan="${ms.length+2}"></td></tr>`+ls.map(linha).join(''):'';
  const vis=S.cartao.linhas.filter(visivel);
  const prox=mesesDe(h >= ms[0] ? h : ms[0]);
  const futuro=prox.reduce((a,m)=>a+totalCartao(m),0);
  const ultimo=[...ms].reverse().find(m=>totalCartao(m)>0);
  document.getElementById('tela').innerHTML=`
  <div class="barra"><div><h2>${esc(nomeCartao())}</h2><p class="sub">Faltam ${brl(futuro)} em parcelas, de ${curtoMes(prox[0])} até ${curtoMes(ultimo)}. O total de cada mês alimenta a linha do cartão nas despesas.</p></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <label class="check"><input type="checkbox" id="soFalta" ${soFalta?'checked':''}>Só o que ainda falta pagar</label>
      ${t>0?`<label class="check"><input type="checkbox" id="incluirConferir" ${S.cartao.incluirConferir?'checked':''}>Somar as parcelas a conferir (${brl(t)})</label>`:''}
    </div></div>
  <form class="form" id="novaCompra">
    <label>Nova compra parcelada<input class="largo" name="desc" required></label>
    <label>Valor da parcela<input class="curto" name="valor" inputmode="decimal" required></label>
    <label>Parcelas<input class="curto" name="n" type="number" min="1" max="60" required></label>
    <label>Primeira parcela em<input name="ini" type="month" value="${h}" required></label>
    <button class="btn">Adicionar</button>
  </form>
  <div class="rola"><table>
    <thead><tr><th class="nome">Compra</th><th style="text-align:left">Data</th><th style="text-align:left">Parcela</th>${ms.map(m=>`<th class="${m===h?'atual':''}">${curtoMes(m)}</th>`).join('')}</tr></thead>
    <tbody>
      ${sec('Lançadas à parte',vis.filter(l=>l.tipo==='manual'))}
      ${sec('Sem detalhe',vis.filter(l=>l.tipo==='resto'))}
      ${sec('Compras da fatura',vis.filter(l=>l.tipo==='fatura'))}
    </tbody>
    <tfoot><tr><td class="nome">Total do mês</td><td></td><td></td>${ms.map(m=>`<td data-total="cartao|${m}" class="${m===h?'atual':''}">${fmt(totalCartao(m))}</td>`).join('')}</tr></tfoot>
  </table></div>`;
}

/* ---------- dívidas ---------- */
const abatido=d=>r2(d.abatimentos.reduce((t,a)=>t+a.v,0));
const faltaDivida=d=>r2(Math.max(0,d.total-abatido(d)));
const sugestao=d=>r2(mesesDe(hoje()).reduce((t,m)=>t+valorConta(d,m),0));
const semCadastro=()=>S.despesas.filter(d=>d.grupo==='Cartões e crediário'&&!(S.dividas||[]).some(x=>x.conta===d.id));
function telaDividas(){
  const L=S.dividas||[],falta=semCadastro();
  const tot=r2(L.reduce((t,d)=>t+d.total,0)),ab=r2(L.reduce((t,d)=>t+Math.min(d.total,abatido(d)),0));
  const cartoes=L.map(d=>{
    const a=abatido(d),f=faltaDivida(d),pct=d.total?Math.min(100,Math.round(a/d.total*100)):0;
    return `<div class="cartao divida">
      <div class="topo2"><div><h3>${esc(d.nome)}</h3><p class="sub">Abatido ${brl(a)} de ${brl(d.total)}</p></div>
        <div style="text-align:right"><div class="falta">${f>0?brl(f):'Quitada'}</div>${f>0?'<div class="sub">falta pagar</div>':''}</div></div>
      <div class="progresso"><i style="width:${pct}%"></i></div>
      ${f>0?`<form class="abate" data-abater="${esc(d.id)}"><input name="valor" inputmode="decimal" placeholder="Valor pago" aria-label="Valor para abater de ${esc(d.nome)}" required><button class="btn peq pri">Abater</button></form>`:''}
      <div class="abate"><label class="sub">Total da dívida <input data-divida-total="${esc(d.id)}" inputmode="decimal" value="${fmt(d.total)}" aria-label="Total da dívida ${esc(d.nome)}"></label><button class="btn peq" data-apaga-divida="${esc(d.id)}">Apagar dívida</button></div>
      ${d.abatimentos.length?`<div class="hist">${d.abatimentos.map((x,i)=>`<span>${x.d.split('-').reverse().join('/')}: ${fmt(x.v)}<button class="x" data-tira-abate="${i}" data-divida="${esc(d.id)}" aria-label="Apagar abatimento de ${fmt(x.v)}">×</button></span>`).join('')}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('tela').innerHTML=`
  <div class="barra"><div><h2>Abater cartões e dívidas</h2><p class="sub">Confira o total que você deve em cada cartão e vá abatendo. Isso não muda as contas de cada mês.</p></div></div>
  ${L.length?`<div class="kpis">
    <div class="cartao kpi"><div class="rot">Total das dívidas</div><div class="val">${brl(tot)}</div></div>
    <div class="cartao kpi"><div class="rot">Já abatido</div><div class="val">${brl(ab)}</div></div>
    <div class="cartao kpi"><div class="rot">Falta pagar</div><div class="val">${brl(r2(tot-ab))}</div></div>
  </div>`:''}
  <form class="form" id="novaDivida">
    <label>Nova dívida<input class="largo" name="nome" required></label>
    <label>Total que deve<input class="curto" name="total" inputmode="decimal" required></label>
    <button class="btn">Adicionar</button>
  </form>
  <div class="dividas">${cartoes}</div>
  ${falta.length?`<div class="cartao" style="margin-top:14px">
    <div class="topo2" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>Seus cartões</h3><p class="sub">O valor sugerido é a soma do que está lançado daqui para frente. Troque pelo total real da dívida, se for diferente.</p></div>
      <button class="btn pri" id="cadTodos">Cadastrar todos</button></div>
    ${falta.map(d=>`<form class="abate" data-cad-cartao="${esc(d.id)}" style="justify-content:space-between;border-bottom:1px solid var(--linha2);padding-bottom:6px"><span>${esc(d.nome)}</span><span style="display:flex;gap:6px;align-items:center"><input name="total" inputmode="decimal" value="${sugestao(d)?fmt(sugestao(d)):''}" placeholder="Total" aria-label="Total da dívida ${esc(d.nome)}" style="width:130px;border:1px solid #cfccc1;border-radius:8px;padding:5px 9px;background:#fff" required><button class="btn peq">Cadastrar</button></span></form>`).join('')}
  </div>`:''}`;
}

/* ---------- gráfico de barras ---------- */
function graficoBarras(el,cats,series,o){
  el.innerHTML='';if(!cats.length)return;
  const W=640,H=o.altura,E=46,T=16,B=24,NS='http://www.w3.org/2000/svg';
  const max=Math.max(1,...cats.flatMap(c=>series.map(s=>s.v(c))));
  const passo=max>20000?10000:max>8000?5000:max>3000?2000:1000;
  const topo=Math.ceil(max/passo)*passo,ph=H-T-B,pw=W-E;
  const y=v=>T+ph-(v/topo)*ph;
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');
  svg.setAttribute('aria-label',series.map(s=>s.nome).join(' e ')+' por mês');
  const add=(n,a,p=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
  const defs=add('defs',{});
  const pat=add('pattern',{id:'hach'+el.id,width:5,height:5,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  add('rect',{width:5,height:5,fill:'#fcfcfb'},pat);add('rect',{width:2.4,height:5,fill:'#eb6834'},pat);
  for(let v=0;v<=topo;v+=passo){
    add('line',{x1:E,x2:W,y1:y(v),y2:y(v),stroke:v?'#efede6':'#cfccc1','stroke-width':1});
    const t=add('text',{x:E-8,y:y(v)+4,'text-anchor':'end','font-size':11.5,fill:'#6b6a64'});t.textContent=v>=1000?(v/1000)+' mil':'0';
  }
  const g=pw/cats.length,bw=Math.min(30,(g-12-(series.length-1)*2)/series.length);
  const dica=document.getElementById('dica');
  const mostrar=(ev,c)=>{
    dica.textContent='';const b=document.createElement('b');b.textContent=nomeMes(c);dica.appendChild(b);
    series.forEach(s=>{const d=document.createElement('div'),i=document.createElement('i'),t=document.createElement('span');
      i.style.background=s.cor;t.textContent=brl(s.v(c))+' '+s.nome.toLowerCase()+(s.parcial&&s.parcial(c)?' (incompleto)':'');d.append(i,t);dica.appendChild(d)});
    dica.style.display='block';
    const r=ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():{left:0,top:0};
    const px=ev.clientX||r.left,py=ev.clientY||r.top;
    dica.style.left=Math.min(px+14,innerWidth-250)+'px';dica.style.top=(py+14)+'px';
  };
  const esconder=()=>dica.style.display='none';
  cats.forEach((c,i)=>{
    const x0=E+g*i+(g-(bw*series.length+2*(series.length-1)))/2;
    series.forEach((s,j)=>{
      const v=s.v(c);if(v<=0)return;
      const x=x0+j*(bw+2),yy=y(v),h=T+ph-yy,r=Math.min(4,h,bw/2);
      add('path',{d:`M${x},${T+ph}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${T+ph}Z`,fill:s.parcial&&s.parcial(c)?`url(#hach${el.id})`:s.cor});
    });
    if(o.rotulo&&o.rotulo.includes(c)){
      const t=add('text',{x:x0+bw/2,y:y(series[0].v(c))-5,'text-anchor':'middle','font-size':11.5,'font-weight':600,fill:'#1a2226'});
      t.textContent=fmt(series[0].v(c));
    }
    const l=add('text',{x:E+g*i+g/2,y:H-7,'text-anchor':'middle','font-size':11.5,fill:'#52514e'});l.textContent=curtoMes(c);
    const alvo=add('rect',{x:E+g*i,y:T,width:g,height:ph+B,fill:'transparent',tabindex:0,'aria-label':nomeMes(c)+': '+series.map(s=>s.nome+' '+brl(s.v(c))).join(', ')});
    alvo.addEventListener('pointermove',ev=>mostrar(ev,c));alvo.addEventListener('pointerleave',esconder);
    alvo.addEventListener('focus',ev=>mostrar(ev,c));alvo.addEventListener('blur',esconder);
  });
  el.appendChild(svg);
}

/* ---------- cópia de segurança ---------- */
document.getElementById('baixar').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='financas-casa-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
});
document.getElementById('abrir').addEventListener('click',()=>document.getElementById('arquivo').click());
document.getElementById('arquivo').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    if(!valido(o))throw 0;
    if(!S||confirm('Trocar tudo o que está aqui pelo conteúdo dessa cópia?'))await carregarCopia(o);
  }catch(_){alert('Esse arquivo não é uma cópia deste sistema.')}
});
document.getElementById('sair').addEventListener('click',async()=>{
  if(pendente)await gravar();
  await sb.auth.signOut();location.reload();
});

/* ---------- entrada ---------- */
let modoCriar=false,erroLogin='';
function telaLogin(){
  document.body.classList.add('fora');aviso('');
  document.getElementById('abas').innerHTML='';
  document.getElementById('tela').innerHTML=`<form class="cartao entrada" id="login">
    <h2>${modoCriar?'Criar minha conta':'Entrar'}</h2>
    <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
    <label>Senha<input name="senha" type="password" minlength="8" autocomplete="${modoCriar?'new-password':'current-password'}" required></label>
    ${erroLogin?`<p class="erro-txt">${esc(erroLogin)}</p>`:''}
    <button class="btn pri">${modoCriar?'Criar conta':'Entrar'}</button>
    <button type="button" class="link" id="trocaModo">${modoCriar?'Já tenho conta':'Primeiro acesso? Criar minha conta'}</button>
  </form>`;
}
async function entrar(email,senha){
  erroLogin='';
  const r=modoCriar?await sb.auth.signUp({email,password:senha}):await sb.auth.signInWithPassword({email,password:senha});
  if(r.error||!r.data.session){
    const m=r.error?r.error.message:'';
    erroLogin=/invalid login/i.test(m)?'E-mail ou senha incorretos.':/not allowed|disabled/i.test(m)?'O cadastro de contas novas está fechado.':/already/i.test(m)?'Esse e-mail já tem conta.':/confirm/i.test(m)||!r.error?'Confirme o e-mail antes de entrar.':'Não consegui entrar. Tente de novo.';
    telaLogin();return;
  }
  usuario=r.data.session.user;await abrirDados();
}
function telaImportar(){
  document.getElementById('abas').innerHTML='';
  document.getElementById('tela').innerHTML=`<div class="cartao entrada"><h2>Carregue seus dados</h2>
    <p class="sub">Escolha o arquivo com os dados para começar. Depois disso eles ficam guardados na sua conta.</p>
    <button class="btn pri" id="importar">Escolher arquivo</button></div>`;
}
async function carregarCopia(o){
  const antes=S;
  document.getElementById('tela').innerHTML='<div class="cartao entrada"><h2>Gravando seus dados…</h2></div>';
  S=o;mes=null;pendente=true;ultimoErro='';
  await gravar();
  let motivo=pendente?ultimoErro:'';
  if(!motivo&&!travado){
    const r=await sb.from('financas').select('versao').eq('dono',usuario.id).maybeSingle();
    if(r.error)motivo=r.error.message;
    else if(!r.data)motivo='o banco aceitou, mas a linha não voltou na leitura';
  }
  if(!motivo){aviso('Tudo salvo');desenhar();return}
  clearTimeout(timer);timer=null;pendente=false;S=antes;
  aviso('');
  document.getElementById('abas').innerHTML='';
  document.getElementById('tela').innerHTML=`<div class="cartao entrada"><h2>Os dados não foram gravados</h2>
    <p class="erro-txt">Motivo: ${esc(motivo)}</p>
    <p class="sub">Tire um print desta tela.</p>
    <button class="btn pri" id="importar">Tentar de novo</button></div>`;
}
async function abrirDados(){
  document.body.classList.remove('fora');
  document.getElementById('quem').textContent=usuario.email||'';
  document.getElementById('tela').innerHTML='<p class="sub">Carregando…</p>';
  const r=await sb.from('financas').select('dados,versao').eq('dono',usuario.id).maybeSingle();
  if(r.error){document.getElementById('tela').innerHTML='<p class="erro-txt">Não consegui abrir os dados. Recarregue a página.</p>';return}
  if(!r.data){telaImportar();return}
  S=r.data.dados;versao=r.data.versao;temLinha=true;
  aviso('Tudo salvo');desenhar();
}
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){usuario=data.session.user;await abrirDados()}else telaLogin();
})();
</script>
